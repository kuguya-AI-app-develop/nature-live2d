[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live2d-llm-expression"
version = "0.1.0"
description = "Rule-first Live2D expression runtime for LLM-generated emotion intents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

