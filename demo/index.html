<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature Live2D Web Demo</title>
    <script type="module" src="/demo/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <aside class="control-panel">
        <header class="panel-header">
          <span>Nature Live2D</span>
          <h1>Conversation Demo</h1>
        </header>

        <label class="field">
          <span>Runtime</span>
          <select id="runtime">
            <option value="pixi-live2d-display">pixi-live2d-display</option>
            <option value="auto">auto</option>
          </select>
        </label>

        <section class="chat-card" aria-label="Conversation">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <label class="field chat-field">
              <span>Your message</span>
              <textarea id="chat-input" rows="3" placeholder="输入一句真实对话，观察八千代如何边回复边反应。"></textarea>
            </label>
            <div class="button-row">
              <button id="send-message" type="submit">Send</button>
              <button id="clear-chat" type="button">Clear</button>
            </div>
          </form>
        </section>

        <div class="field-grid">
          <label class="field">
            <span>Intensity</span>
            <input id="intensity" type="range" min="0" max="1" step="0.05" value="0.75" />
          </label>
          <label class="field">
            <span>Duration</span>
            <input id="duration" type="number" min="400" max="4000" step="100" value="1600" />
          </label>
        </div>

        <div class="tuning-grid">
          <label class="field">
            <span>Stream weight</span>
            <input id="stream-weight" type="range" min="0.2" max="1" step="0.05" value="1" />
          </label>
          <label class="field">
            <span>Smoothing</span>
            <input id="smoothing" type="range" min="80" max="900" step="20" value="380" />
          </label>
          <label class="field">
            <span>Stability</span>
            <input id="stability" type="range" min="0" max="1" step="0.01" value="0.68" />
          </label>
          <label class="field">
            <span>Expressiveness</span>
            <input id="expressiveness" type="range" min="0.6" max="3.2" step="0.05" value="3.2" />
          </label>
        </div>

        <div class="button-row">
          <button id="play-shy" type="button">Shy</button>
          <button id="play-happy" type="button">Happy</button>
          <button id="play-proud" type="button">Proud</button>
          <button id="play-excited" type="button">Excited</button>
          <button id="play-beaming" type="button">Beaming</button>
          <button id="play-grateful" type="button">Grateful</button>
          <button id="play-tender" type="button">Tender</button>
          <button id="play-playful" type="button">Playful</button>
          <button id="play-amused" type="button">Amused</button>
          <button id="play-skeptical" type="button">Skeptical</button>
          <button id="play-reassuring" type="button">Reassure</button>
          <button id="play-focused" type="button">Focused</button>
          <button id="play-frustrated" type="button">Frustrated</button>
          <button id="play-guarded" type="button">Guarded</button>
          <button id="play-startled" type="button">Startled</button>
          <button id="play-bracing" type="button">Bracing</button>
          <button id="play-delighted" type="button">Delighted</button>
          <button id="play-flustered" type="button">Flustered</button>
          <button id="play-wistful" type="button">Wistful</button>
          <button id="play-nervous" type="button">Nervous</button>
          <button id="play-resolve" type="button">Resolve</button>
          <button id="play-apology" type="button">Apology</button>
          <button id="play-suspicious" type="button">Suspicious</button>
          <button id="play-comfort" type="button">Comfort</button>
          <button id="play-sparkle" type="button">Sparkle</button>
          <button id="play-relief-laugh" type="button">Relief Laugh</button>
          <button id="play-hypervent" type="button">Hypervent</button>
          <button id="play-blank" type="button">Blank</button>
          <button id="play-cover-face" type="button">Cover Face</button>
          <button id="play-side-eye" type="button">Side Eye</button>
          <button id="play-tongue" type="button">Tongue</button>
          <button id="play-deadpan" type="button">Deadpan</button>
          <button id="play-glare" type="button">Glare</button>
          <button id="play-tears" type="button">Tears</button>
          <button id="play-sob" type="button">Sob</button>
          <button id="play-head-nod" type="button">Head Nod</button>
        </div>

        <section class="reply-card" aria-label="Assistant reply">
          <span>Latest assistant reply</span>
          <p id="assistant-reply">Waiting for a message.</p>
        </section>

        <section class="signal-card" aria-label="Stream signal">
          <span>Stream signal</span>
          <p id="stream-signal">Idle</p>
        </section>

        <section class="llm-card" aria-label="LLM evaluation">
          <span>Semantic calibration</span>
          <p id="llm-summary">Waiting for a message.</p>
        </section>

        <dl class="stats">
          <div>
            <dt>Model</dt>
            <dd id="model-name">Loading</dd>
          </div>
          <div>
            <dt>Capability</dt>
            <dd id="capability">Scanning</dd>
          </div>
          <div>
            <dt>Emotion</dt>
            <dd id="emotion">Neutral</dd>
          </div>
          <div>
            <dt>Params</dt>
            <dd id="params">0</dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="status">Booting</dd>
          </div>
        </dl>
      </aside>

      <main class="stage-shell" aria-label="Live2D preview">
        <canvas id="live2d-canvas"></canvas>
      </main>
    </div>
  </body>
</html>
